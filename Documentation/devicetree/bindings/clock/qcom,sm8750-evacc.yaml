%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm8750-evacc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm EVA Clock Controller on SM8750

maintainers:
  - Stephen Boyd <sboyd@kernel.org>
  - Taniya Das <quic_tdas@quicinc.com>

description: |
  Qualcomm EVA clock control module provides the clocks, resets and power
  domains for the computer vision subsystem on SM8750.

  See also: include/dt-bindings/clock/qcom,sm8750-evacc.h

properties:
  compatible:
    const: qcom,sm8750-evacc

  clocks:
    items:
      - description: Board XO source
      - description: Board active-only XO source
      - description: Sleep clock source

  power-domains:
    items:
      - description: MMCX power domain
      - description: MXC power domain

  required-opps:
    items:
      - description: MMCX performance point
      - description: MXC performance point

required:
  - compatible
  - clocks
  - power-domains
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>

    clock-controller@abf0000 {
        compatible = "qcom,sm8750-evacc";
        reg = <0x0abf0000 0x10000>;
        clocks = <&bi_tcxo_div2>,
                 <&bi_tcxo_ao_div2>,
                 <&sleep_clk>;
        power-domains = <&rpmhpd RPMHPD_MMCX>,
                        <&rpmhpd RPMHPD_MXC>;
        required-opps = <&rpmhpd_opp_low_svs>,
                        <&rpmhpd_opp_low_svs>;
        #clock-cells = <1>;
        #reset-cells = <1>;
        #power-domain-cells = <1>;
    };
