%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/southchip,sc8541.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Southchip SC8541 switched capacitor charger

maintainers:
  - Junhao Xie <bigfoot@radxa.com>

description:
  The SC8541 is a 2:1 and 4:1 switched capacitor charger, used next to a main
  charger so that a USB PD PPS adapter can deliver a higher charging current at
  a lower conversion loss. It is controlled over I2C and reports bus and
  battery voltage, current and die temperature through an internal ADC.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: southchip,sc8541

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Alarm and fault interrupt, active low.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        charger@6a {
            compatible = "southchip,sc8541";
            reg = <0x6a>;
            interrupt-parent = <&tlmm>;
            interrupts = <68 IRQ_TYPE_EDGE_FALLING>;
        };
    };
