%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,jpeg-encoder.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm JPEG Encoder

maintainers:
  - Atanas Filipov <atanas.filipov@oss.qualcomm.com>

description:
  Qualcomm JPEG Encoder is the JPEG encode hardware present in Qualcomm SoCs.

properties:
  compatible:
    enum:
      - qcom,sm8250-jenc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 6

  clock-names:
    items:
      - const: hf_axi
      - const: sf_axi
      - const: core_ahb
      - const: cpas_ahb
      - const: cnoc_axi
      - const: jpeg

  interconnects:
    maxItems: 3

  interconnect-names:
    items:
      - const: cpu-cfg
      - const: hf-mnoc
      - const: sf-mnoc

  iommus:
    maxItems: 1

  operating-points-v2: true

  opp-table:
    type: object

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts
  - interconnects
  - interconnect-names
  - iommus

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,camcc-sm8250.h>
    #include <dt-bindings/clock/qcom,gcc-sm8250.h>
    #include <dt-bindings/interconnect/qcom,icc.h>
    #include <dt-bindings/interconnect/qcom,sm8250.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    jpeg-encoder@ac53000 {
        compatible = "qcom,sm8250-jenc";
        reg = <0xac53000 0x1000>;

        interrupts = <GIC_SPI 474 IRQ_TYPE_EDGE_RISING>;

        clocks = <&gcc GCC_CAMERA_HF_AXI_CLK>,
                 <&gcc GCC_CAMERA_SF_AXI_CLK>,
                 <&camcc CAM_CC_CORE_AHB_CLK>,
                 <&camcc CAM_CC_CPAS_AHB_CLK>,
                 <&camcc CAM_CC_CAMNOC_AXI_CLK>,
                 <&camcc CAM_CC_JPEG_CLK>;
        clock-names = "hf_axi",
                      "sf_axi",
                      "core_ahb",
                      "cpas_ahb",
                      "cnoc_axi",
                      "jpeg";

        interconnects = <&gem_noc MASTER_AMPSS_M0 QCOM_ICC_TAG_ACTIVE_ONLY
                         &config_noc SLAVE_CAMERA_CFG QCOM_ICC_TAG_ACTIVE_ONLY>,
                        <&mmss_noc MASTER_CAMNOC_HF QCOM_ICC_TAG_ALWAYS
                         &mc_virt SLAVE_EBI_CH0 QCOM_ICC_TAG_ALWAYS>,
                        <&mmss_noc MASTER_CAMNOC_SF QCOM_ICC_TAG_ALWAYS
                         &mc_virt SLAVE_EBI_CH0 QCOM_ICC_TAG_ALWAYS>;
        interconnect-names = "cpu-cfg",
                             "hf-mnoc",
                             "sf-mnoc";

        iommus = <&apps_smmu 0x2040 0x400>;

        operating-points-v2 = <&jpeg_opp_table>;

        jpeg_opp_table: opp-table {
            compatible = "operating-points-v2";

            opp-100000000 {
                opp-hz = /bits/ 64 <400000000>,
                         /bits/ 64 <100000000>;
                opp-peak-kBps = <76800 104166 104166>;
                opp-avg-kBps = <38400 33569 33569>;
                required-opps = <&rpmhpd_opp_min_svs>;
            };

            opp-200000000 {
                opp-hz = /bits/ 64 <400000000>,
                         /bits/ 64 <200000000>;
                opp-peak-kBps = <76800 208333 208333>;
                opp-avg-kBps = <38400 67138 67138>;
                required-opps = <&rpmhpd_opp_low_svs>;
            };

            opp-400000000 {
                opp-hz = /bits/ 64 <400000000>,
                         /bits/ 64 <400000000>;
                opp-peak-kBps = <76800 416666 416666>;
                opp-avg-kBps = <38400 134277 134277>;
                required-opps = <&rpmhpd_opp_svs>;
            };

            opp-480000000 {
                opp-hz = /bits/ 64 <400000000>,
                         /bits/ 64 <480000000>;
                opp-peak-kBps = <76800 500000 500000>;
                opp-avg-kBps = <38400 161132 161132>;
                required-opps = <&rpmhpd_opp_svs_l1>;
            };

            opp-600000000 {
                opp-hz = /bits/ 64 <400000000>,
                         /bits/ 64 <600000000>;
                opp-peak-kBps = <76800 625000 625000>;
                opp-avg-kBps = <38400 201416 201416>;
                required-opps = <&rpmhpd_opp_nom>;
            };
        };
    };
