%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov32d40.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV32D40 CMOS Image Sensor

maintainers:
  - map220v <map220v300@gmail.com>

description:
  The OmniVision OV32D40 is a 32-megapixel CMOS image sensor that outputs
  10-bit Bayer data over a four-lane MIPI CSI-2 interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov32d40

  reg:
    maxItems: 1

  clocks:
    description: 19.2 MHz sensor input clock
    maxItems: 1

  avdd-supply:
    description: Analog voltage supply, 2.8 volts

  vddd-supply:
    description: Digital core voltage supply, 1.2 volts

  vddio-supply:
    description: Digital I/O voltage supply, 1.8 volts

  reset-gpios:
    description:
      GPIO connected to the active-low sensor reset input.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies:
            items:
              - const: 842400000

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - vddd-supply
  - vddio-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "ovti,ov32d40";
            reg = <0x10>;

            clocks = <&camera_clk>;
            assigned-clocks = <&camera_clk>;
            assigned-clock-rates = <19200000>;

            avdd-supply = <&camera_avdd_2v8>;
            vddd-supply = <&camera_vddd_1v2>;
            vddio-supply = <&camera_vddio_1v8>;
            reset-gpios = <&gpio 7 GPIO_ACTIVE_LOW>;

            orientation = <0>;
            rotation = <270>;

            port {
                endpoint {
                    remote-endpoint = <&csi2_in>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <842400000>;
                };
            };
        };
    };
...
